<!--
  Supabase → Authentication → Emails → Templates → "Reset password".
  Subject: Restablece tu contraseña de Libreta
  {{ .RedirectTo }} is the /auth/reset-password URL the API passes (production or local); it must be
  in the redirect allowlist.
-->
<h2>Restablece tu contraseña</h2>
<p>
  Recibimos una solicitud para cambiar la contraseña de tu cuenta de Libreta. El enlace caduca en
  una hora y solo sirve una vez:
</p>
<p>
  <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery">
    Elegir una contraseña nueva
  </a>
</p>
<p>Si no lo pediste, ignora este mensaje: tu contraseña no cambia.</p>
